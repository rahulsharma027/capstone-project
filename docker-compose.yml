version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: movie-booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: movie_booking_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-booking-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/movie_booking_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - movie-booking-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movie-booking-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - movie-booking-network

networks:
  movie-booking-network:
    driver: bridge

volumes:
  mysql-data:
