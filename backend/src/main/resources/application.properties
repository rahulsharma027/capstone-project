# Server Configuration
server.port=8080
spring.application.name=movie-ticket-booking

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=movieTicketBookingSecretKeyForJWTTokenGenerationAndValidation2024
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:4200

# Logging
logging.level.com.movieticket=DEBUG
logging.level.org.springframework.security=DEBUG
